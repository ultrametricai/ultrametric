name = "productarena-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

routes = [
  { pattern = "ultrametric.ai/*", zone_name = "ultrametric.ai" }
]

# Root assets for the landing pages retained by the zone's page overrides.
# This is an explicit binding to the existing landing Worker, not a public origin.
[[services]]
binding = "LANDING_ASSETS"
service = "tight-lake-8796"

# Compare-popularity counters (pair keys only — no IPs/UAs; see worker.js "Compare popularity
# counter"). Also holds the /api/try live-probe rate-limit window (`tryrl:` keys — SHA-256
# hashed IPs in minute buckets, 120 s TTL, so still no raw IPs at rest; see worker.js "Live
# probe re-runs"). Operator setup, one-time, before deploying this config:
#   wrangler kv namespace create UM_COMPARE_STATS
# then paste the returned id below and `wrangler deploy`. Until then the worker degrades
# honestly: counting no-ops and /api/popular-compares returns 503 (the client renders nothing).
# The binding was renamed from the pre-rename PA_COMPARE_STATS (worker.js still reads the old
# name as a fallback); the namespace id is unchanged, so the stored counters carry over —
# KV data is keyed by namespace id, never by binding name.
[[kv_namespaces]]
binding = "UM_COMPARE_STATS"
id = "ed14fd00ad8a4fe5a0a82f4eff4d55f3"

# Watchlist storage (GET/PUT /api/watchlist — worker.js "Watchlist API"): per-account starred
# product ids under watchlist:<user id> keys. Uses UM_COMPARE_STATS above by default (prefix
# keeps the keyspaces apart — no extra setup to go live). To split it out later, create a
# dedicated namespace and bind it as UM_WATCHLIST (pre-rename PA_WATCHLIST also honored); the
# worker prefers it when present:
#   wrangler kv namespace create UM_WATCHLIST
# [[kv_namespaces]]
# binding = "UM_WATCHLIST"
# id = "<paste id>"

# Auth backend (/productarena/auth/* — WorkOS AuthKit; see worker.js "Auth backend" and
# docs/AUTH.md). Operator setup, one-time:
#   1. Paste the WorkOS client ID (dashboard → the UM environment → API keys) below.
#   2. wrangler secret put WORKOS_API_KEY    # the sk_… API key from the same page
#   3. wrangler secret put PA_SESSION_KEY    # cookie-signing key: `openssl rand -base64 48`
#      (PA_SESSION_KEY is the legacy, pre-rename secret name — the deployed secret lives under
#      it; renaming the binding without re-putting the secret would break auth. Founder action
#      tracked in docs/FOUNDER-ASKS.md.)
# Until all three are set, /auth/* fails closed with an explicit "auth not configured" 500 and
# the site itself is unaffected (the client session hook degrades to anonymous).
[vars]
WORKOS_CLIENT_ID = "client_01M2NPR7ESG9M87Q3G81387YNH"
# WORKOS_MOCK: NEVER add it here. It is the dev-only login harness (fake test@ultrametric.ai
# session, no WorkOS, no secrets) and must only ever be passed per-run:
#   wrangler dev --var WORKOS_MOCK:1
# Defense in depth: worker.js's isMockAuth also refuses mock mode for any request on the
# production hostname, so even a mistaken deploy of this var cannot fake logins on
# ultrametric.ai. See docs/AUTH.md "Testing locally with mock mode".
# Try-it sandbox-tier credentials (worker.js "BYO-key / sandbox credentials" section): optional
# per-product demo credentials stored as wrangler secrets named DEMO_CRED_<PRODUCTID>
# (uppercased, dashes -> underscores; e.g. `wrangler secret put DEMO_CRED_STRIPE` with a Stripe
# TEST-MODE key). Provisioning checklist and safety rules: docs/TRY-IT-DEMO-ACCOUNTS.md.
# No secret provisioned -> the "use our sandbox account" option simply never appears.
