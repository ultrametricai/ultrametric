<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="color:var(--icon-ink,#d4d4d8)" role="img" aria-label="Sponsor a work visa"><title>Sponsor a work visa</title><desc>Keep the hire you can’t legally employ yet: pick the visa strategy with immigration counsel (H-1B, O-1, TN), build the evidence binder, file the LCA with the DOL, sign and file the I-129 petition with USCIS, and wait out adjudication.</desc><path d="M81 64H284L330 110V419H81ZM284 64V110H330" stroke="var(--icon-ink, #d4d4d8)" fill="var(--icon-surface, #09090b)" /><path d="M111 130L297 130" stroke="var(--icon-detail, #85968f)" fill="none" /><path d="M111 159L250 159" stroke="var(--icon-detail, #85968f)" fill="none" /><path d="M111 188L297 188" stroke="var(--icon-detail, #85968f)" fill="none" /><path d="M111 217L250 217" stroke="var(--icon-detail, #85968f)" fill="none" /><path d="M111 246L297 246" stroke="var(--icon-detail, #85968f)" fill="none" /><path d="M111 275L250 275" stroke="var(--icon-detail, #85968f)" fill="none" /><circle cx="340" cy="332" r="103" stroke="var(--icon-accent, #34d399)" fill="var(--icon-surface, #09090b)"/><ellipse cx="340" cy="332" rx="42" ry="103" stroke="var(--icon-accent, #34d399)" fill="none"/><path d="M237 332L443 332" stroke="var(--icon-accent, #34d399)" fill="none" /><path d="M258 270Q340 294 422 270M258 394Q340 370 422 394" stroke="var(--icon-accent, #34d399)" fill="none" /></svg>
