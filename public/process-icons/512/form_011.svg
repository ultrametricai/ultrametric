<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="color:var(--icon-ink,#d4d4d8)" role="img" aria-label="Set up an LLC"><title>Set up an LLC</title><desc>Form an LLC: name check, Articles of Organization with a registered agent, a signed operating agreement, then the EIN, bank account, and state-tax registrations. The default for holding companies, agencies, and bootstrapped businesses — founders planning to raise priced venture rounds should incorporate a Delaware C-Corp instead, and an LLC that later takes that path runs the statutory conversion (see Convert an LLC to a C-Corp).</desc><path d="M116 73H313L359 119V427H116ZM313 73V119H359" stroke="var(--icon-ink, #d4d4d8)" fill="var(--icon-surface, #09090b)" /><path d="M144 135L275 135" stroke="var(--icon-detail, #85968f)" fill="none" /><path d="M144 161L315 161" stroke="var(--icon-detail, #85968f)" fill="none" /><path d="M144 187L275 187" stroke="var(--icon-detail, #85968f)" fill="none" /><path d="M144 213L315 213" stroke="var(--icon-detail, #85968f)" fill="none" /><path d="M144 239L275 239" stroke="var(--icon-detail, #85968f)" fill="none" /><path d="M144 265L315 265" stroke="var(--icon-detail, #85968f)" fill="none" /><circle cx="337" cy="342" r="83" stroke="var(--icon-accent, #34d399)" fill="var(--icon-surface, #09090b)"/><circle cx="337" cy="342" r="72" stroke="var(--icon-detail, #85968f)" fill="none"/><path d="M290 320 337 291 384 320ZM289 380H385" stroke="var(--icon-accent, #34d399)" fill="none" /><path d="M304 330V370" stroke="var(--icon-ink, #d4d4d8)" fill="none" /><path d="M326 330V370" stroke="var(--icon-ink, #d4d4d8)" fill="none" /><path d="M348 330V370" stroke="var(--icon-ink, #d4d4d8)" fill="none" /><path d="M370 330V370" stroke="var(--icon-ink, #d4d4d8)" fill="none" /></svg>
