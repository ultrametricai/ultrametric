# Task-branch evaluation runner. Restore the main workflow before opening the catalog PR.
name: AML vendor evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { category: compliance-screening, product: complyadvantage }
          - { category: identity-verification, product: complyadvantage }
          - { category: fraud-prevention, product: complyadvantage }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Evaluate scoped vendor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_CATEGORY: ${{ matrix.category }}
          EVAL_PRODUCT: ${{ matrix.product }}
        run: |
          python3 - <<'PYRUN'
          import os, subprocess, json, pathlib, sys
          category=os.environ['EVAL_CATEGORY']; product=os.environ['EVAL_PRODUCT']
          results=[]
          if not os.environ.get('ANTHROPIC_API_KEY'):
              raise SystemExit('Hosted evaluation credential is not configured')
          pathlib.Path('engine-artifacts').mkdir(exist_ok=True)
          evidence=pathlib.Path(f'open-rankings/{category}/evidence/{product}.json')
          collected=evidence.exists() and len(json.loads(evidence.read_text())) > 0
          stages=([] if collected else ['crawl','extract','collect-community','probe'])+['judge','claims','pricing','integrations']
          for stage in stages:
              print('Starting '+stage+' for '+category+'/'+product,flush=True)
              if stage=='judge':
                  import tempfile, concurrent.futures
                  base=pathlib.Path('open-rankings')
                  stories=json.loads((base/category/'stories.json').read_text())
                  products=json.loads((base/category/'products.json').read_text())
                  selected=[p for p in products if p['id']==product]
                  assert len(selected)==1
                  chunks=[stories[i::4] for i in range(4)]
                  assert len({s['id'] for chunk in chunks for s in chunk})==len(stories)
                  def judge_chunk(chunk):
                      with tempfile.TemporaryDirectory(prefix='um-judge-') as directory:
                          data=pathlib.Path(directory);arena=data/category
                          (arena/'evidence').mkdir(parents=True)
                          (data/'categories.json').write_bytes((base/'categories.json').read_bytes())
                          (arena/'products.json').write_text(json.dumps(selected))
                          (arena/'stories.json').write_text(json.dumps(chunk))
                          (arena/'evidence'/f'{product}.json').write_bytes(evidence.read_bytes())
                          env=os.environ.copy();env['UM_DATA_DIR']=str(data)
                          return subprocess.run(['node','--import','tsx','rankings-engine/cli.ts','judge','--category',category,'--product',product],env=env).returncode
                  with concurrent.futures.ThreadPoolExecutor(4) as pool:
                      codes=list(pool.map(judge_chunk,chunks))
                  if any(codes):
                      code=next(c for c in codes if c)
                  else:
                      # Assemble only the target's engine-produced matrix. Existing peers are
                      # imported unchanged from committed verdicts after source-hash checks.
                      with tempfile.TemporaryDirectory(prefix='um-target-') as directory:
                          data=pathlib.Path(directory);arena=data/category
                          (arena/'evidence').mkdir(parents=True)
                          (data/'categories.json').write_bytes((base/'categories.json').read_bytes())
                          (arena/'products.json').write_text(json.dumps(selected))
                          (arena/'stories.json').write_text(json.dumps(stories))
                          (arena/'evidence'/f'{product}.json').write_bytes(evidence.read_bytes())
                          env=os.environ.copy();env['UM_DATA_DIR']=str(data)
                          code=subprocess.run(['node','--import','tsx','rankings-engine/cli.ts','judge','--category',category,'--product',product],env=env).returncode
                          if code==0:
                              pathlib.Path('engine-artifacts/target-verdicts.json').write_bytes((arena/'verdicts.json').read_bytes())
              elif stage=='pricing':
                  supported=subprocess.run(['node','--import','tsx','-e',"const {PRICING_ARENAS}=require('./lib/pricing');process.exit(process.env.EVAL_CATEGORY in PRICING_ARENAS?0:2)"]).returncode
                  if supported==2:
                      print('Pricing normalization is not configured for this arena; retain source-linked commercial assessment.',flush=True)
                      results.append({'stage':stage,'status':'skipped','reason':'arena not covered by per-action pricing lane'})
                      pathlib.Path('engine-artifacts/stages.json').write_text(json.dumps(results,indent=2))
                      continue
                  code=subprocess.run(['node','--import','tsx','rankings-engine/cli.ts',stage,'--category',category,'--product',product]).returncode
              else:
                  code=subprocess.run(['node','--import','tsx','rankings-engine/cli.ts',stage,'--category',category,'--product',product]).returncode
              results.append({'stage':stage,'exit_code':code})
              pathlib.Path('engine-artifacts/stages.json').write_text(json.dumps(results,indent=2))
              if code:
                  sys.exit(code)
          PYRUN
      - name: Preserve evaluation outputs
        if: always()
        env:
          EVAL_CATEGORY: ${{ matrix.category }}
          EVAL_PRODUCT: ${{ matrix.product }}
        run: |
          python3 - <<'PYRUN'
          import os, tarfile, pathlib
          c=os.environ['EVAL_CATEGORY'];p=os.environ['EVAL_PRODUCT']
          pathlib.Path('engine-artifacts').mkdir(exist_ok=True)
          paths=[f'open-rankings/{c}',f'rankings-engine/cache/judge/{c}/{p}',f'rankings-engine/cache/crawl/{c}/{p}',f'rankings-engine/cache/extract/{c}/{p}.json','engine-artifacts/stages.json','engine-artifacts/target-verdicts.json']
          with tarfile.open(f'engine-artifacts/{c}--{p}.tar.gz','w:gz') as archive:
              for source in paths:
                  if pathlib.Path(source).exists(): archive.add(source,arcname=source)
          PYRUN
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.category }}--${{ matrix.product }}
          path: engine-artifacts/*.tar.gz
          retention-days: 7
