# Task-branch evaluation runner. Restore the main workflow before opening the catalog PR.
name: AML vendor evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { category: compliance-screening, product: complyadvantage }
          - { category: compliance-screening, product: flagright }
          - { category: compliance-screening, product: sardine }
          - { category: compliance-screening, product: alloy }
          - { category: compliance-screening, product: salv }
          - { category: compliance-screening, product: hummingbird }
          - { category: identity-verification, product: complyadvantage }
          - { category: fraud-prevention, product: complyadvantage }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Evaluate scoped vendor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_CATEGORY: ${{ matrix.category }}
          EVAL_PRODUCT: ${{ matrix.product }}
        run: |
          python3 - <<'PYRUN'
          import os, subprocess, json, pathlib, sys
          category=os.environ['EVAL_CATEGORY']; product=os.environ['EVAL_PRODUCT']
          results=[]
          if not os.environ.get('ANTHROPIC_API_KEY'):
              raise SystemExit('Hosted evaluation credential is not configured')
          pathlib.Path('engine-artifacts').mkdir(exist_ok=True)
          for stage in ['crawl','extract','collect-community','probe','judge','claims','pricing','integrations']:
              result=subprocess.run(['node','--import','tsx','rankings-engine/cli.ts',stage,'--category',category,'--product',product])
              results.append({'stage':stage,'exit_code':result.returncode})
              pathlib.Path('engine-artifacts/stages.json').write_text(json.dumps(results,indent=2))
              if result.returncode:
                  sys.exit(result.returncode)
          PYRUN
      - name: Preserve evaluation outputs
        if: always()
        env:
          EVAL_CATEGORY: ${{ matrix.category }}
          EVAL_PRODUCT: ${{ matrix.product }}
        run: |
          python3 - <<'PYRUN'
          import os, tarfile, pathlib
          c=os.environ['EVAL_CATEGORY'];p=os.environ['EVAL_PRODUCT']
          pathlib.Path('engine-artifacts').mkdir(exist_ok=True)
          paths=[f'open-rankings/{c}',f'rankings-engine/cache/judge/{c}/{p}',f'rankings-engine/cache/crawl/{c}/{p}',f'rankings-engine/cache/extract/{c}/{p}.json','engine-artifacts/stages.json']
          with tarfile.open(f'engine-artifacts/{c}--{p}.tar.gz','w:gz') as archive:
              for source in paths:
                  if pathlib.Path(source).exists(): archive.add(source,arcname=source)
          PYRUN
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.category }}--${{ matrix.product }}
          path: engine-artifacts/*.tar.gz
          retention-days: 7
