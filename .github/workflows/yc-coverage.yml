# Weekly YC coverage engine: the KEYLESS always-gaining loop that grows YC batch coverage.
# Runs rankings-engine/scripts/yc-coverage-queue.ts — re-crawls YC's public directory (yc-oss/api
# mirror), filters to ACTIVE companies that fit an EXISTING arena (yc-classify verdicts where
# available, DOMAIN_VOCAB keyword match otherwise) and show a real docs/API surface (bounded
# keyless HTTP checks), and re-ranks open-rankings/yc-queue.json (batch recency x arena fit x docs
# surface) — then:
#
#   1. commits the refreshed queue via the usual PR-or-issue flow (merging it is the human
#      review point — the queue only nominates, it never scores),
#   2. opens a work-queue issue (label: story-runner, the same label every automation reuses)
#      listing the next 10 bring-up candidates.
#
# Deliberately keyless: this workflow NOMINATES and RANKS; the actual bring-up (crawl ->
# extract -> probe -> judge -> claims -> derive -> intervals) happens in keyed runs that work
# through the issue. The window widens over time — batches back to Winter 2016 — because the
# queue re-ranks the whole window every run and already-tracked companies drop out on their own.
#
# Cron offset from the other loops: story-runner '17 */6 * * *', daily-snapshot '43 5 * * *',
# cert-sweep '29 7 * * 1' (Mondays), accuracy-engine '41 6 * * 3' (Wednesdays) — this runs
# Fridays 06:53 UTC.
name: yc-coverage

on:
  schedule:
    - cron: '53 6 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: yc-coverage
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The queue refresh itself: keyless, bounded (<= 12 concurrent HTTP checks, 6s timeouts).
      # --refetch pulls a fresh directory snapshot; the full 2016+ window keeps widening
      # coverage backwards while newer batches outrank older ones at equal fit.
      - name: Refresh YC coverage queue
        run: pnpm tsx rankings-engine/scripts/yc-coverage-queue.ts --refetch --years 2016-2026 --issue-body /tmp/yc-queue-issue.md

      - name: Tests
        run: pnpm test

      - name: Commit queue as PR (or compare-link issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if git diff --quiet -- rankings; then
            echo "No queue change — done."
            exit 0
          fi
          BRANCH="yc-coverage/$RUN_ID"
          git config user.name "ultrametric-yc-coverage"
          git config user.email "noreply@ultrametric.ai"
          git checkout -b "$BRANCH"
          git add rankings
          git commit -m "chore(yc-coverage): weekly YC coverage-queue refresh"
          git push -u origin "$BRANCH"
          # Same org-policy fallback as story-runner/accuracy-engine: if Actions may not open
          # PRs, leave an issue carrying the compare link so the queue is never stranded.
          if ! gh pr create \
            --title "yc-coverage: weekly queue refresh" \
            --body "Keyless YC coverage-queue refresh (rankings-engine/scripts/yc-coverage-queue.ts). The queue nominates active YC companies for bring-up into existing arenas — it never changes a score or verdict. Next candidates are in the companion work-queue issue." \
            --base main --head "$BRANCH"; then
            gh issue create \
              --title "yc-coverage: queue refresh ready on $BRANCH" \
              --body "The weekly YC coverage queue is committed on [\`$BRANCH\`](https://github.com/${GITHUB_REPOSITORY}/compare/main...$BRANCH) but Actions may not open PRs (org policy). Open the PR from the compare link." \
              --label "story-runner" || echo "issue creation also failed — branch $BRANCH is pushed; see run logs"
          fi

      # The ranked work queue: the next 10 bring-up candidates, for human triage and as the
      # paper trail the keyed bring-up runs work through.
      - name: Open work-queue issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "yc-coverage: next bring-up candidates $(date -u +%F)" \
            --body-file /tmp/yc-queue-issue.md \
            --label "story-runner" || echo "work-queue issue creation failed — the same ranking is committed in open-rankings/yc-queue.json"
