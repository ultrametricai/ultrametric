# Weekly accuracy engine (docs/accuracy.md): the KEYLESS staleness pass over the whole fleet.
# Runs rankings-engine/scripts/staleness-scan.ts — evidence-age percentiles, live sample-checks of the
# top-cited evidence URLs, the crawl-gap audit signatures (api-quality gap, the cline agent-docs
# contradiction), and live llms.txt / documented-MCP flip re-checks — then:
#
#   1. commits open-rankings/staleness-report.json via the usual PR-or-issue flow (the report only steers
#      story-runner's arena pick once it lands on main — merging it is the human review point),
#   2. opens a ranked work-queue issue (label: story-runner, same label every automation reuses)
#      listing the worst-stale arenas/products and every detected flip.
#
# Deliberately keyless: this workflow DETECTS and RANKS; the actual re-crawl + re-judge happens
# in story-runner's keyed 6-hourly runs, which read the committed report and pick the
# worst-stale arena first (see story-runner.yml's "Pick arena" step).
#
# Cron offset from the other loops: story-runner '17 */6 * * *', daily-snapshot '43 5 * * *',
# cert-sweep '29 7 * * 1' (Mondays) — this runs Wednesdays 06:41 UTC.
name: accuracy-engine

on:
  schedule:
    - cron: '41 6 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: accuracy-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The scan itself: keyless, bounded (≤4 concurrent HTTP checks, 8s timeouts, top-cited
      # URLs only). Writes open-rankings/staleness-report.json + the work-queue issue body.
      - name: Fleet staleness scan
        run: pnpm tsx rankings-engine/scripts/staleness-scan.ts --issue-body /tmp/staleness-issue.md

      - name: Tests
        run: pnpm test

      - name: Commit report as PR (or compare-link issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if git diff --quiet -- rankings; then
            echo "No staleness-report change — done."
            exit 0
          fi
          pnpm stats
          BRANCH="accuracy-engine/$RUN_ID"
          git config user.name "ultrametric-accuracy-engine"
          git config user.email "noreply@ultrametric.ai"
          git checkout -b "$BRANCH"
          git add rankings README.md
          git commit -m "chore(accuracy-engine): weekly fleet staleness scan"
          git push -u origin "$BRANCH"
          # Same org-policy fallback as story-runner: if Actions may not open PRs, leave an
          # issue carrying the compare link so the report is never stranded on a branch.
          if ! gh pr create \
            --title "accuracy-engine: weekly staleness report" \
            --body "Keyless fleet staleness scan (rankings-engine/scripts/staleness-scan.ts). Merging this report makes story-runner prioritize the worst-stale arenas (see story-runner.yml's pick step). Flips/contradictions listed in the companion work-queue issue need keyed re-judges — this report never changes a verdict." \
            --base main --head "$BRANCH"; then
            gh issue create \
              --title "accuracy-engine: staleness report ready on $BRANCH" \
              --body "The weekly staleness report is committed on [\`$BRANCH\`](https://github.com/${GITHUB_REPOSITORY}/compare/main...$BRANCH) but Actions may not open PRs (org policy). Open the PR from the compare link — story-runner only reads the report once it lands on main." \
              --label "story-runner" || echo "issue creation also failed — branch $BRANCH is pushed; see run logs"
          fi

      # The ranked work queue: worst-stale arenas/products + every detected flip, for human
      # triage and as the paper trail the keyed story-runner runs work through.
      - name: Open work-queue issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "accuracy-engine: work queue $(date -u +%F)" \
            --body-file /tmp/staleness-issue.md \
            --label "story-runner" || echo "work-queue issue creation failed — the same ranking is committed in open-rankings/staleness-report.json"
