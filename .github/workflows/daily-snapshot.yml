# Daily keyless fleet-wide snapshot: densifies the time-series datasets every single day,
# instead of one arena per 6 hours via story-runner's rotation:
#
#   open-rankings/slo-history.jsonl          — agent-surface uptime (rankings-engine/scripts/slo-check.ts is
#                                     already fleet-wide and fully keyless).
#   open-rankings/*/popularity-history.jsonl — stars/downloads time series. `rankings-engine/cli.ts popularity`
#                                     with no --category runs every arena (rankings-engine/paths.ts
#                                     resolveCategories); it appends one history line per product
#                                     per run even when its 7-day fetch cache is warm, so the
#                                     series densifies daily while upstream fetches stay ~weekly.
#
# Requires ZERO repo secrets — no LLM API key needed or used, so unlike story-runner's gated
# engine this runs green on the current repo as-is every day. secrets.GITHUB_TOKEN is
# auto-provided by Actions and only used for git push / gh pr|issue create / authenticated GitHub
# star lookups (rankings-engine/stages/popularity.ts prefers `gh api` whenever `gh auth status` passes,
# which it does with GH_TOKEN exported — 1,000 req/hr instead of the 60/hr unauthenticated cap;
# npm/pypi registry endpoints are keyless). Fetch failures degrade to last cached values and
# never fail the run.
#
# compute-confidence-intervals.ts is deliberately NOT run here even though it is LLM-free and
# cheap (seeded PRNG): score intervals only change when verdicts or the measured re-roll stats
# move, and this workflow never touches verdicts (popularity is a display-only signal, never fed
# into scoring) — story-runner re-runs it post-derive after re-judges.
name: daily-snapshot

on:
  schedule:
    - cron: '43 5 * * *' # daily 05:43 UTC — offset from story-runner's '17 */6 * * *' ticks
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write # for the PR→issue fallback below (org policy may forbid Actions creating PRs)

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyless and cheap (~300 HTTP checks, ≤3 concurrent, 8s timeout): appends one uptime line
      # per documented agent surface (llms.txt / remote MCP / openapi.json) to
      # open-rankings/slo-history.jsonl. Same script story-runner runs 6-hourly — this daily run guarantees
      # at least one fleet-wide sample per day even if story-runner is idle or gated.
      - name: Agent-surface SLO check
        run: pnpm tsx rankings-engine/scripts/slo-check.ts

      # Fleet-wide popularity refresh (no --category = every arena). NO LLM CALLS — pure display
      # signal (see rankings-engine/stages/popularity.ts). Updates open-rankings/*/popularity.json when the 7-day
      # cache is stale and appends today's line to open-rankings/*/popularity-history.jsonl either way.
      - name: Popularity refresh (fleet-wide)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm tsx rankings-engine/cli.ts popularity

      - name: Tests
        run: pnpm test

      - name: Open PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if git diff --quiet -- rankings; then
            echo "No data changes — done."
            exit 0
          fi
          pnpm stats   # keep the README's generated counts in sync with the refreshed data
          BRANCH="daily-snapshot/$RUN_ID"
          git config user.name "ultrametric-daily-snapshot"
          git config user.email "noreply@ultrametric.ai"
          git checkout -b "$BRANCH"
          git add rankings README.md
          git commit -m "chore(daily-snapshot): fleet-wide SLO + popularity snapshot"
          git push -u origin "$BRANCH"
          # Org policy currently forbids Actions from creating PRs ("Write permissions for
          # workflows are disabled by the organization") — fall back to an issue carrying the
          # compare link so the snapshot is never silently stranded on a branch (mirrors
          # story-runner.yml; reuses its existing "story-runner" label so the fallback never
          # fails on a missing label).
          if ! gh pr create \
            --title "daily-snapshot: fleet-wide SLO + popularity" \
            --body "Automated daily keyless snapshot: agent-surface SLO checks (\`open-rankings/slo-history.jsonl\`) and fleet-wide popularity history (\`open-rankings/*/popularity-history.jsonl\` + \`open-rankings/*/popularity.json\`). No verdicts or rankings touched — display-only time series, safe to merge on green CI." \
            --base main --head "$BRANCH"; then
            gh issue create \
              --title "daily-snapshot: ready on $BRANCH" \
              --body "The daily snapshot is committed on [\`$BRANCH\`](https://github.com/${GITHUB_REPOSITORY}/compare/main...$BRANCH) but Actions may not open PRs (org policy). Open the PR from the compare link — no verdict review needed, this workflow only appends SLO/popularity time series. Enable org Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests' to remove this manual step." \
              --label "story-runner" || echo "issue creation also failed — branch $BRANCH is pushed; see run logs"
          fi
