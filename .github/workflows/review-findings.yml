name: Review findings gate

# Reads review metadata only. Foreloop is deliberately excluded.
on:
  workflow_call:
    inputs:
      pr:
        type: string
        default: ''
      head:
        type: string
        default: ''
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '4,14,24,34,44,54 * * * *' # recheck resolved threads
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to check (blank checks all open PRs)
        required: false
        type: string

permissions:
  checks: read # inspect Greptile completion on the current head
  pull-requests: read
  statuses: write

jobs:
  targets:
    if: >-
      (github.event_name != 'check_run' || github.event.check_run.app.slug == 'greptile-apps') &&
      (github.event_name != 'pull_request_review' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.select.outputs.prs }}
    steps:
      - name: Select review targets
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_PR: ${{ inputs.pr || github.event.pull_request.number || '' }}
          TARGET_HEAD: ${{ inputs.head || github.event.check_run.head_sha || '' }}
        shell: python
        run: |
          import json, os, subprocess
          pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp',
                   f"repos/{os.environ['REPO']}/pulls?state=open&per_page=100"], text=True))
          target_pr = os.environ.get('TARGET_PR', '')
          target_head = os.environ.get('TARGET_HEAD', '')
          numbers = [pr['number'] for page in pages for pr in page
                     if (not target_pr or str(pr['number']) == target_pr)
                     and (target_pr or not target_head or pr['head']['sha'] == target_head)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('prs=' + json.dumps(numbers) + '\n')

  findings:
    needs: [targets]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        pr: ${{ fromJSON(needs.targets.outputs.prs) }}
    # Serialize each PR across sweeps, CI and events. An event for another PR
    # cannot cancel this PR's pending gate or monopolize its concurrency slot.
    concurrency:
      group: review-findings-pr-${{ matrix.pr }}
      cancel-in-progress: false
    if: >-
      needs.targets.outputs.prs != '[]' &&
      (github.event_name != 'check_run' || github.event.check_run.app.slug == 'greptile-apps') &&
      (github.event_name != 'pull_request_review' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # No checkout or PR-code execution, including for pull_request_target.
      - name: Gate unresolved Greptile findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          TARGET_PR: ${{ matrix.pr }}
        shell: python
        run: |
          import json, os, subprocess
          repo = os.environ['REPO']
          owner, name = repo.split('/')
          numbers = [int(os.environ['TARGET_PR'])]
          def api(path, data=None):
              args = ['gh', 'api', path]
              if data is not None:
                  args += ['--method', 'POST', '--input', '-']
              return json.loads(subprocess.check_output(args, input=json.dumps(data) if data is not None else None, text=True))
          def publish(sha, state, description):
              # Polling must not append identical statuses: GitHub caps each SHA/context.
              previous = api(f'repos/{repo}/commits/{sha}/status')['statuses']
              current = next((item for item in previous if item['context'] == 'review-findings'), None)
              if current and current['state'] == state and current.get('description') == description:
                  return
              api(f'repos/{repo}/statuses/{sha}', {
                  'state': state, 'context': 'review-findings', 'description': description,
                  'target_url': f"{os.environ['SERVER_URL']}/{repo}/actions/runs/{os.environ['RUN_ID']}"})
          query = '''query($owner:String!, $name:String!, $number:Int!, $cursor:String) {
            repository(owner:$owner,name:$name) { pullRequest(number:$number) {
              headRefOid reviewThreads(first:100,after:$cursor) {
                pageInfo { hasNextPage endCursor }
                nodes { isResolved comments(first:1) { nodes { author { login } } } }
              }
            } }
          }'''
          errors = []
          for number in numbers:
              initial = None
              try:
                  initial = api(f'repos/{repo}/pulls/{number}')
                  sha = initial['head']['sha']
                  checks = api(f'repos/{repo}/commits/{sha}/check-runs?check_name=Greptile%20Review&per_page=100')
                  latest = max((check for check in checks['check_runs'] if check['app']['id'] == 867647),
                               key=lambda check: check['id'], default=None)
                  reviewed = latest is not None and latest['status'] == 'completed' and latest['conclusion'] == 'success'
                  cursor, blocked = None, 0
                  while True:
                      result = api('graphql', {'query': query, 'variables': {
                          'owner':owner, 'name':name, 'number':number, 'cursor':cursor}})
                      if result.get('errors'):
                          raise RuntimeError(result['errors'])
                      pr = result['data']['repository']['pullRequest']
                      if sha is not None and pr['headRefOid'] != sha:
                          raise RuntimeError('PR head changed during review pagination; retry')
                      sha = pr['headRefOid']
                      threads = pr['reviewThreads']
                      for thread in threads['nodes']:
                          authors = {((c.get('author') or {}).get('login')) for c in thread['comments']['nodes']}
                          if not thread['isResolved'] and authors.intersection({'greptile-apps', 'greptile-apps[bot]', 'greptileai'}):
                              blocked += 1
                      if not threads['pageInfo']['hasNextPage']:
                          break
                      cursor = threads['pageInfo']['endCursor']
                  # A delayed review event must never approve a different head.
                  current = api(f'repos/{repo}/pulls/{number}')
                  if current['head']['sha'] != sha or current['state'] != 'open':
                      continue
                  publish(sha, ('failure' if blocked else 'success') if reviewed else 'pending',
                          f'{blocked} unresolved Greptile findings; Foreloop excluded'
                          if reviewed else 'Waiting for Greptile on this revision; Foreloop excluded')
                  print(f'#{number}: {blocked} unresolved Greptile findings')
              except Exception as error:
                  # Metadata/API failures revoke any stale approval for this head.
                  try:
                      if initial is not None and initial['state'] == 'open':
                          publish(initial['head']['sha'], 'pending', 'Review metadata unavailable; retry required')
                  except Exception:
                      pass
                  print(f'::warning::#{number}: {error}', flush=True)
                  errors.append(number)
          if errors:
              raise SystemExit(f'Review gates need retry for PRs: {errors}')
