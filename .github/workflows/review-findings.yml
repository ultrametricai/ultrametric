name: Review findings gate

# Reads review metadata only. Verified Renovate PRs may omit Greptile completion;
# unresolved Greptile findings still block them. Foreloop is deliberately excluded.
on:
  workflow_call:
    inputs:
      pr:
        type: string
        default: ''
      head:
        type: string
        default: ''
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '4,14,24,34,44,54 * * * *' # recheck resolved threads
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to check (blank checks all open PRs)
        required: false
        type: string

permissions:
  contents: read # read only the trusted main policy, never candidate code
  actions: read # recover a success status linked to a failed shared workflow run
  checks: read # inspect Greptile completion on the current head
  pull-requests: read
  statuses: write

jobs:
  targets:
    if: >-
      (github.event_name != 'check_run' || github.event.check_run.app.slug == 'greptile-apps') &&
      (github.event_name != 'pull_request_review' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.select.outputs.prs }}
    steps:
      - name: Select review targets
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_PR: ${{ inputs.pr || github.event.pull_request.number || '' }}
          TARGET_HEAD: ${{ inputs.head || github.event.check_run.head_sha || '' }}
        shell: python
        run: |
          import json, os, subprocess
          pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp',
                   f"repos/{os.environ['REPO']}/pulls?state=open&per_page=100"], text=True))
          target_pr = os.environ.get('TARGET_PR', '')
          target_head = os.environ.get('TARGET_HEAD', '')
          numbers = [pr['number'] for page in pages for pr in page
                     if (not target_pr or str(pr['number']) == target_pr)
                     and (target_pr or not target_head or pr['head']['sha'] == target_head)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('prs=' + json.dumps(numbers) + '\n')

  findings:
    needs: [targets]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        pr: ${{ fromJSON(needs.targets.outputs.prs) }}
    # Serialize each PR across sweeps, CI and events. An event for another PR
    # cannot cancel this PR's pending gate or monopolize its concurrency slot.
    concurrency:
      group: review-findings-pr-${{ matrix.pr }}
      cancel-in-progress: false
    if: >-
      needs.targets.outputs.prs != '[]' &&
      (github.event_name != 'check_run' || github.event.check_run.app.slug == 'greptile-apps') &&
      (github.event_name != 'pull_request_review' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Read trusted main content policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/refresh_policy.py
          sparse-checkout-cone-mode: false
      # Only trusted main policy code executes; candidate files are Git metadata.
      - name: Gate unresolved Greptile findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          TARGET_PR: ${{ matrix.pr }}
          CONTENT_BOT_LOGIN: ${{ vars.CONTENT_BOT_LOGIN }}
          PYTHONPATH: scripts
        shell: python
        run: |
          import json, os, re, subprocess
          from urllib.parse import quote
          repo = os.environ['REPO']
          owner, name = repo.split('/')
          numbers = [int(os.environ['TARGET_PR'])]
          def api(path, data=None):
              args = ['gh', 'api', path]
              if data is not None:
                  args += ['--method', 'POST', '--input', '-']
              return json.loads(subprocess.check_output(args, input=json.dumps(data) if data is not None else None, text=True))
          def publish(sha, state, description, *, allow_status_read_failure=False):
              # Polling must not append identical statuses: GitHub caps each SHA/context.
              target_url = f"{os.environ['SERVER_URL']}/{repo}/actions/runs/{os.environ['RUN_ID']}"
              try:
                  previous = api(f'repos/{repo}/commits/{sha}/status')['statuses']
              except Exception:
                  # Only the fail-closed pending fallback may write without a read.
                  if not allow_status_read_failure or state != 'pending':
                      raise
              else:
                  current = next((item for item in previous if item['context'] == 'review-findings'), None)
                  if current and current['state'] == state and current.get('description') == description:
                      if state != 'success' or current.get('target_url') == target_url:
                          return
                      # Another PR's matrix job can fail after this PR publishes success.
                      # Preserve healthy or active links; repair only a completed failure
                      # after this run has freshly evaluated the same PR head and findings.
                      prefix = f"{os.environ['SERVER_URL']}/{repo}/actions/runs/"
                      match = re.fullmatch(re.escape(prefix) + r'(\d+)', current.get('target_url') or '')
                      if not match:
                          raise RuntimeError('Review status does not reference this repository workflow')
                      run_id = int(match[1])
                      previous_run = api(f'repos/{repo}/actions/runs/{run_id}')
                      if previous_run.get('id') != run_id:
                          raise RuntimeError('Review status workflow identity unavailable')
                      if (previous_run.get('status') != 'completed' or previous_run.get('conclusion') not in
                          ['failure', 'cancelled', 'timed_out', 'startup_failure', 'action_required', 'neutral', 'skipped', 'stale']):
                          return
              api(f'repos/{repo}/statuses/{sha}', {
                  'state': state, 'context': 'review-findings', 'description': description,
                  'target_url': target_url})
          query = '''query($owner:String!, $name:String!, $number:Int!, $cursor:String) {
            repository(owner:$owner,name:$name) { pullRequest(number:$number) {
              headRefOid reviewThreads(first:100,after:$cursor) {
                pageInfo { hasNextPage endCursor }
                nodes { isResolved comments(first:1) { nodes { author { login } } } }
              }
            } }
          }'''
          def renovate_exempt(pr):
              # Trust GitHub's bot identity, not a title, label, or branch alone.
              author = pr.get('user') or {}
              head = pr.get('head') or {}
              return (author.get('id') == 29139614
                      and author.get('login') == 'renovate[bot]'
                      and author.get('type') == 'Bot'
                      and (head.get('repo') or {}).get('full_name') == repo
                      and head.get('ref', '').startswith('renovate/'))
          def internal_policy(pr, inspect_files=True):
              match = re.fullmatch(r'(story-runner|vendor-radar|vendor-radar-bringup)/[A-Za-z0-9_-]+', pr.get('head', {}).get('ref', ''))
              if match is None:
                  return
              from refresh_policy import actions_author, content_author, held, check_scope, verify_provenance
              kind = match.group(1)
              if held(pr) or pr.get('draft') is not False:
                  raise RuntimeError('Internal refresh is held or draft; automatic merge is stopped')
              if (pr.get('base', {}).get('ref') != 'main' or
                  (pr.get('base', {}).get('repo') or {}).get('full_name') != repo or
                  (pr['head'].get('repo') or {}).get('full_name') != repo):
                  raise RuntimeError('Internal refresh must stay within this repository and target main')
              author = pr.get('user') or {}
              if not actions_author(author):
                  login = os.environ.get('CONTENT_BOT_LOGIN', '')
                  if not content_author(author):
                      raise RuntimeError('Internal refresh author is not authenticated')
                  expected = api('users/' + quote(login, safe=''))
                  if expected.get('id') != author.get('id') or expected.get('type') != 'Bot':
                      raise RuntimeError('Configured content bot identity mismatch')
              verify_provenance(api, repo, pr)
              reviews = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp',
                        f"repos/{repo}/pulls/{pr['number']}/reviews?per_page=100"], text=True))
              latest = {}
              for review in sorted([review for page in reviews for review in page], key=lambda review: review['id']):
                  user = review.get('user') or {}
                  if (user.get('type') == 'User' or user.get('login') in ['greptile-apps', 'greptile-apps[bot]', 'greptileai']) and review['state'] in ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED']:
                      latest[user['id']] = review['state']
              if 'CHANGES_REQUESTED' in latest.values():
                  raise RuntimeError('A reviewer requested changes; automatic merge is stopped')
              if not inspect_files:
                  return
              files = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp',
                      f"repos/{repo}/pulls/{pr['number']}/files?per_page=100"], text=True))
              files = [file for page in files for file in page]
              trees = {}
              def mode(path):
                  tree = pr['head']['sha']
                  parts = path.split('/')
                  for index, part in enumerate(parts):
                      if tree not in trees:
                          data = api(f'repos/{repo}/git/trees/{tree}')
                          if data.get('truncated') is not False:
                              raise RuntimeError('Git tree inspection was truncated or unavailable')
                          trees[tree] = {entry['path']: entry for entry in data['tree']}
                      entry = trees[tree].get(part)
                      if entry is None:
                          return None
                      if index == len(parts) - 1:
                          return entry['mode'] if entry['type'] == 'blob' else None
                      if entry['type'] != 'tree' or entry['mode'] != '040000':
                          return None
                      tree = entry['sha']
              check_scope(kind, files, pr.get('changed_files'), mode)
          errors = []
          for number in numbers:
              initial = None
              try:
                  initial = api(f'repos/{repo}/pulls/{number}')
                  sha = initial['head']['sha']
                  internal_policy(initial)
                  exempt = renovate_exempt(initial)
                  reviewed = False
                  if not exempt:
                      checks = api(f'repos/{repo}/commits/{sha}/check-runs?check_name=Greptile%20Review&per_page=100')
                      latest = max((check for check in checks['check_runs'] if check['app']['id'] == 867647),
                                   key=lambda check: check['id'], default=None)
                      reviewed = latest is not None and latest['status'] == 'completed' and latest['conclusion'] == 'success'
                  cursor, blocked = None, 0
                  while True:
                      result = api('graphql', {'query': query, 'variables': {
                          'owner':owner, 'name':name, 'number':number, 'cursor':cursor}})
                      if result.get('errors'):
                          raise RuntimeError(result['errors'])
                      pr = result['data']['repository']['pullRequest']
                      if sha is not None and pr['headRefOid'] != sha:
                          raise RuntimeError('PR head changed during review pagination; retry')
                      sha = pr['headRefOid']
                      threads = pr['reviewThreads']
                      for thread in threads['nodes']:
                          authors = {((c.get('author') or {}).get('login')) for c in thread['comments']['nodes']}
                          if not thread['isResolved'] and authors.intersection({'greptile-apps', 'greptile-apps[bot]', 'greptileai'}):
                              blocked += 1
                      if not threads['pageInfo']['hasNextPage']:
                          break
                      cursor = threads['pageInfo']['endCursor']
                  # A delayed review event must never approve a different head.
                  current = api(f'repos/{repo}/pulls/{number}')
                  if current['head']['sha'] != sha or current['state'] != 'open':
                      continue
                  internal_policy(current, inspect_files=False)
                  if exempt and not renovate_exempt(current):
                      raise RuntimeError('Renovate exemption metadata changed; retry')
                  if exempt:
                      publish(sha, 'failure' if blocked else 'success',
                              f'{blocked} unresolved Greptile findings; Renovate completion exempt'
                              if blocked else 'Greptile completion exempt: verified Renovate PR; no unresolved findings')
                  else:
                      publish(sha, ('failure' if blocked else 'success') if reviewed else 'pending',
                              f'{blocked} unresolved Greptile findings; Foreloop excluded'
                              if reviewed else 'Waiting for Greptile on this revision; Foreloop excluded')
                  print(f'#{number}: {blocked} unresolved Greptile findings')
              except Exception as error:
                  # Metadata/API failures revoke any stale approval for this head.
                  try:
                      if initial is not None and initial['state'] == 'open':
                          publish(initial['head']['sha'], 'pending', 'Review metadata unavailable; retry required',
                                  allow_status_read_failure=True)
                  except Exception:
                      pass
                  print(f'::warning::#{number}: {error}', flush=True)
                  errors.append(number)
          if errors:
              raise SystemExit(f'Review gates need retry for PRs: {errors}')

