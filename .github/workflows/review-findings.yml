name: Review findings gate

# Reads review metadata only. Foreloop is deliberately excluded.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '4,14,24,34,44,54 * * * *' # recheck resolved threads
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Originating PR number (all open PRs are checked)
        required: false
        type: string

permissions:
  checks: read # inspect Greptile completion on the current head
  pull-requests: read
  statuses: write

# Serialize metadata reads and status writes so an older run cannot overwrite a
# newer finding result on the same revision. Every queued run reads fresh state.
concurrency:
  group: review-findings-gate
  cancel-in-progress: false

jobs:
  findings:
    if: github.event_name != 'check_run' || github.event.check_run.app.slug == 'greptile-apps'
    runs-on: ubuntu-latest
    steps:
      # No checkout or PR-code execution, including for pull_request_target.
      - name: Gate unresolved Greptile findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        shell: python
        run: |
          import json, os, subprocess
          repo = os.environ['REPO']
          owner, name = repo.split('/')
          # GitHub retains only one pending run in a concurrency group. Every
          # replacement run sweeps all PRs so a cancelled event loses no update.
          pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp',
                   f'repos/{repo}/pulls?state=open&per_page=100'], text=True))
          numbers = [pr['number'] for page in pages for pr in page]
          def api(path, data=None):
              args = ['gh', 'api', path]
              if data is not None:
                  args += ['--method', 'POST', '--input', '-']
              return json.loads(subprocess.check_output(args, input=json.dumps(data) if data is not None else None, text=True))
          query = '''query($owner:String!, $name:String!, $number:Int!, $cursor:String) {
            repository(owner:$owner,name:$name) { pullRequest(number:$number) {
              headRefOid reviewThreads(first:100,after:$cursor) {
                pageInfo { hasNextPage endCursor }
                nodes { isResolved comments(first:1) { nodes { author { login } } } }
              }
            } }
          }'''
          for number in numbers:
              initial = api(f'repos/{repo}/pulls/{number}')
              sha = initial['head']['sha']
              checks = api(f'repos/{repo}/commits/{sha}/check-runs?check_name=Greptile%20Review&per_page=100')
              reviewed = any(check['app']['id'] == 867647 and check['status'] == 'completed'
                             and check['conclusion'] == 'success' for check in checks['check_runs'])
              cursor, blocked = None, 0
              while True:
                  result = api('graphql', {'query': query, 'variables': {
                      'owner':owner, 'name':name, 'number':number, 'cursor':cursor}})
                  if result.get('errors'):
                      raise RuntimeError(result['errors'])
                  pr = result['data']['repository']['pullRequest']
                  if sha is not None and pr['headRefOid'] != sha:
                      raise RuntimeError('PR head changed during review pagination; retry')
                  sha = pr['headRefOid']
                  threads = pr['reviewThreads']
                  for thread in threads['nodes']:
                      authors = {((c.get('author') or {}).get('login')) for c in thread['comments']['nodes']}
                      if not thread['isResolved'] and authors.intersection({'greptile-apps', 'greptile-apps[bot]', 'greptileai'}):
                          blocked += 1
                  if not threads['pageInfo']['hasNextPage']:
                      break
                  cursor = threads['pageInfo']['endCursor']
              # A delayed review event must never approve a different head.
              current = api(f'repos/{repo}/pulls/{number}')
              if current['head']['sha'] != sha or current['state'] != 'open':
                  continue
              api(f'repos/{repo}/statuses/{sha}', {
                  'state': ('failure' if blocked else 'success') if reviewed else 'pending',
                  'context': 'review-findings',
                  'description': (f'{blocked} unresolved Greptile findings; Foreloop excluded'
                                  if reviewed else 'Waiting for Greptile on this revision; Foreloop excluded'),
                  'target_url': f"{os.environ['SERVER_URL']}/{repo}/actions/runs/{os.environ['RUN_ID']}"})
              print(f'#{number}: {blocked} unresolved Greptile findings')
