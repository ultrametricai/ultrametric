name: Refresh auto-merge recovery

# GITHUB_TOKEN PR events create approval-required runs; explicit CI dispatches run
# the same gates. Refresh stale bases only when an active ruleset requires it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '37,7 * * * *'
  workflow_dispatch:

permissions:
  checks: read # request Greptile when a recovered head has no review
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-automerge-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'ultrametricai/ultrametric' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CONTENT_BOT: ${{ secrets.CONTENT_BOT_APP_ID != '' && secrets.CONTENT_BOT_PRIVATE_KEY != '' }}
    outputs:
      updated: ${{ steps.recover.outputs.updated }}
      planned: ${{ steps.recover.outputs.planned }}
    steps:
      - name: Read trusted main content policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/refresh_policy.py
            scripts/refresh_update.py
            scripts/refresh-automerge.py
            scripts/refresh_main_ci.py
          sparse-checkout-cone-mode: false
      # All internal content branch updates use this token. CI/review dispatches
      # retain GITHUB_TOKEN, so the App needs no Actions or workflow-write access.
      - name: Mint content branch-update token
        id: content-app
        continue-on-error: true # metadata checks still run; branch publication fails closed
        if: vars.CONTENT_BOT_LOGIN != '' && env.HAS_CONTENT_BOT == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CONTENT_BOT_APP_ID }}
          private-key: ${{ secrets.CONTENT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      # Trusted-main policy only. No dependencies or PR code execution.
      - name: Recover opted-in refresh PRs after CI
        id: recover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PYTHONPATH: scripts
          CONTENT_BOT_LOGIN: ${{ vars.CONTENT_BOT_LOGIN }}
          CONTENT_BOT_TOKEN: ${{ steps.content-app.outputs.token }}
          CONTENT_BOT_SLUG: ${{ steps.content-app.outputs.app-slug }}
        run: python3 scripts/refresh-automerge.py

      - name: Continue main CI after internal merges
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/refresh_main_ci.py

  attest-updates:
    needs: recover
    if: always() && !cancelled() && needs.recover.outputs.updated != '' && needs.recover.outputs.updated != '[]'
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        update: ${{ fromJSON(needs.recover.outputs.updated) }}
    steps:
      - name: Write verified update receipt
        env:
          RECORD: ${{ toJSON(matrix.update) }}
        run: printf '%s\n' "$RECORD" > head.json
      - uses: actions/upload-artifact@v7
        with:
          name: internal-refresh-${{ matrix.update.family }}-${{ matrix.update.pr }}-${{ matrix.update.head }}
          path: head.json
          if-no-files-found: error
          retention-days: 90

  apply-updates:
    needs: recover
    if: always() && !cancelled() && needs.recover.outputs.planned != '' && needs.recover.outputs.planned != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        plan: ${{ fromJSON(needs.recover.outputs.planned) }}
    env:
      HAS_CONTENT_BOT: ${{ secrets.CONTENT_BOT_APP_ID != '' && secrets.CONTENT_BOT_PRIVATE_KEY != '' }}
    steps:
      - name: Persist exact update intent before branch mutation
        env:
          RECORD: ${{ toJSON(matrix.plan) }}
        run: printf '%s\n' "$RECORD" > head.json
      - name: Upload durable update intent
        uses: actions/upload-artifact@v7
        with:
          name: internal-refresh-update-${{ matrix.plan.family }}-${{ matrix.plan.pr }}-${{ matrix.plan.head }}-${{ matrix.plan.previous }}-${{ matrix.plan.main }}-${{ matrix.plan.tree }}
          path: head.json
          if-no-files-found: error
          retention-days: 90
      - name: Read trusted main recovery code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/refresh_policy.py
            scripts/refresh_update.py
            scripts/refresh-automerge.py
          sparse-checkout-cone-mode: false
      - name: Mint content branch-update token
        id: content-app
        if: matrix.plan.app && vars.CONTENT_BOT_LOGIN != '' && env.HAS_CONTENT_BOT == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CONTENT_BOT_APP_ID }}
          private-key: ${{ secrets.CONTENT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Apply exact planned update after fresh eligibility checks
        id: apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REFRESH_UPDATE: ${{ toJSON(matrix.plan) }}
          CONTENT_BOT_LOGIN: ${{ vars.CONTENT_BOT_LOGIN }}
          CONTENT_BOT_TOKEN: ${{ steps.content-app.outputs.token }}
          CONTENT_BOT_SLUG: ${{ steps.content-app.outputs.app-slug }}
        run: python3 scripts/refresh-automerge.py
      - name: Write observed head receipt
        if: always() && steps.apply.outputs.published_head == matrix.plan.head
        env:
          RECORD: ${{ toJSON(matrix.plan) }}
        run: printf '%s\n' "$RECORD" > head.json
      - name: Attest observed head
        if: always() && steps.apply.outputs.published_head == matrix.plan.head
        uses: actions/upload-artifact@v7
        with:
          name: internal-refresh-${{ matrix.plan.family }}-${{ matrix.plan.pr }}-${{ matrix.plan.head }}
          path: head.json
          if-no-files-found: error
          retention-days: 90
