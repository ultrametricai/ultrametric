# Daily vendor radar (founder ask 2026-10-02: "listen for new vendor launches and do a deep
# spike on them when they come out, so this data set is alive"): runs the KEYLESS scan in
# rankings-engine/scripts/vendor-radar.ts over public launch surfaces — Hacker News (Algolia API:
# Show HN / Launch HN / launch-shaped front-page stories), Product Hunt's public frontpage feed,
# and GitHub repo search (new repos crossing the star-velocity threshold) — matches candidates
# lexically against the arena taxonomy, dedupes against every tracked product, the vendor
# registry, and the committed seen-ledger (rankings-engine/radar-seen.json), then:
#
#   1. commits the dated candidates report (reports/vendor-radar/<date>.{json,md}) + the updated
#      seen-ledger via the usual PR-or-issue flow,
#   2. when there ARE new candidates, files (or updates, on a same-day re-run) a
#      'vendor-radar: candidates YYYY-MM-DD' issue listing them with their evidence links
#      (label: story-runner, the same label every automation reuses).
#
# HONESTY: the scan itself changes nothing under open-rankings/, the radar NEVER creates a new
# ranking, and it NEVER touches a founder-affiliated product autonomously. Approval is
# criteria-based (policies/AGENT_POLICY.md "Vendor-radar candidate approval", founder
# authorization 2026-10-13, replacing checkbox approval): radar-triage.ts applies the criteria
# mechanically (existing-ranking fit via the lexical classifier, docs-surface fetch, shipped-
# product checks, founder-affiliation guard), records every failing candidate as skipped with
# its reason, and radar-bringup.ts adds capped auto-approved passers to their existing arena's
# roster. The bring-up then runs the scoped standard engine run (crawl → extract →
# collect-community → probe → judge --product → derive → logos; LLM stages only when the
# ANTHROPIC_API_KEY repo secret exists — without it, passers stay approved-pending in the triage
# report) and lands as a PR, never a direct push to main. The scan is keyless;
# secrets.GITHUB_TOKEN is auto-provided and only used for git push / gh issue|pr create / the
# higher authenticated GitHub search limit.
#
# Cron offset from the other loops: story-runner '17 */6 * * *', daily-snapshot '43 5 * * *',
# cert-sweep '29 7 * * 1' (Mondays), accuracy-engine '41 6 * * 3' (Wednesdays), yc-coverage
# '53 6 * * 5' (Fridays) — this runs daily 31 minutes past 08:00 UTC.
name: vendor-radar

on:
  schedule:
    - cron: '31 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write # for the candidates issue + the PR→issue fallback (org policy may forbid Actions creating PRs)

concurrency:
  group: vendor-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Seen-ledger updates land on main only when a scan PR merges, so a ledger committed to a
      # still-open (or abandoned) vendor-radar/* branch would otherwise be invisible to the next
      # run, re-nominating its candidates. Extract every radar branch's ledger and hand them to
      # the scan via --merge-seen: stranded keys keep deduping and ride to main with the next
      # merged PR. Each `git show` is gated on its own exit code.
      - name: Collect seen-ledgers from open radar branches
        run: |
          git fetch origin '+refs/heads/vendor-radar/*:refs/remotes/origin/vendor-radar/*'
          mkdir -p /tmp/radar-seen
          : > /tmp/radar-seen/flags
          for REF in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/vendor-radar/*'); do
            SAFE=$(echo "$REF" | tr '/' '-')
            if git show "$REF:rankings-engine/radar-seen.json" > "/tmp/radar-seen/$SAFE.json" 2>/dev/null; then
              printf ' --merge-seen /tmp/radar-seen/%s.json' "$SAFE" >> /tmp/radar-seen/flags
            else
              rm -f "/tmp/radar-seen/$SAFE.json"
            fi
          done
          echo "MERGE_SEEN_FLAGS=$(cat /tmp/radar-seen/flags)" >> "$GITHUB_ENV"

      # The scan itself: keyless, bounded (a handful of HTTP requests, 10s timeouts; GH_TOKEN
      # only raises the GitHub search rate limit). Writes reports/vendor-radar/<date>.{json,md},
      # updates rankings-engine/radar-seen.json, and writes the issue body ONLY when there are new
      # candidates — a quiet day files no issue. A corrupt committed ledger FAILS the run
      # (vendor-radar.ts loadSeenLedger) instead of silently wiping the seen-history.
      - name: Vendor radar scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm tsx rankings-engine/scripts/vendor-radar.ts --issue-body /tmp/vendor-radar-issue.md $MERGE_SEEN_FLAGS

      # Criteria triage (policies/AGENT_POLICY.md): mechanical checks per candidate — fetches
      # the docs surface, applies the shipped-product and affiliation guards — and appends the
      # disposition table (auto-approved / skipped-with-reason / needs-human) to the issue body
      # so every candidate's outcome is recorded where it surfaced.
      - name: Criteria triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/vendor-radar-issue.md ]; then
            echo "No new candidates — nothing to triage."
            exit 0
          fi
          DATE=$(date -u +%F)
          pnpm tsx rankings-engine/scripts/radar-triage.ts \
            --report "reports/vendor-radar/$DATE.json" \
            --out "reports/vendor-radar/$DATE-triage.json" \
            --md /tmp/vendor-radar-triage.md
          printf '\n' >> /tmp/vendor-radar-issue.md
          cat /tmp/vendor-radar-triage.md >> /tmp/vendor-radar-issue.md

      - name: Tests
        run: pnpm test

      - name: Commit report + seen-ledger as PR (or compare-link issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # porcelain, not `git diff --quiet`: a brand-new dated report file is UNTRACKED and
          # invisible to diff.
          if [ -z "$(git status --porcelain -- reports rankings-engine/radar-seen.json)" ]; then
            echo "No report/ledger change — done."
            exit 0
          fi
          BRANCH="vendor-radar/$RUN_ID"
          git config user.name "ultrametric-vendor-radar"
          git config user.email "noreply@ultrametric.ai"
          git checkout -b "$BRANCH"
          git add reports rankings-engine/radar-seen.json
          git commit -m "chore(vendor-radar): daily launch-surface scan"
          git push -u origin "$BRANCH"
          # Org policy currently forbids Actions from creating PRs ("Write permissions for
          # workflows are disabled by the organization") — fall back to an issue carrying the
          # compare link so the report is never silently stranded on a branch (mirrors
          # story-runner.yml; reuses its existing "story-runner" label so the fallback never
          # fails on a missing label).
          if ! gh pr create \
            --title "vendor-radar: daily scan $(date -u +%F)" \
            --body "Automated keyless launch-surface scan (\`rankings-engine/scripts/vendor-radar.ts\`): dated candidates report + seen-ledger update. DETECTION ONLY — no products added, no verdicts touched; candidates are listed in the companion 'vendor-radar: candidates' issue and a deep spike on approved ones runs via the standard engine stages (docs/VENDOR-RADAR.md)." \
            --base main --head "$BRANCH"; then
            gh issue create \
              --title "vendor-radar: report ready on $BRANCH" \
              --body "The daily radar report is committed on [\`$BRANCH\`](https://github.com/${GITHUB_REPOSITORY}/compare/main...$BRANCH) but Actions may not open PRs (org policy). Open the PR from the compare link — the report only records detections, it never changes a score or verdict. Enable org Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests' to remove this manual step." \
              --label "story-runner" || echo "issue creation also failed — branch $BRANCH is pushed; see run logs"
          fi

      # The candidates issue: filed only when the scan found NEW candidates (the script writes
      # the body file only then). Same-day re-runs UPDATE the existing open issue with a comment
      # instead of filing a duplicate. The body itself carries the honesty block: detection only,
      # never auto-add / auto-judge; approval = checking the box / commenting.
      # if: always() — a failure in the tests or the report-PR step must not swallow the
      # candidates issue; the step itself exits 0 when there is no body file to post.
      - name: File or update candidates issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/vendor-radar-issue.md ]; then
            echo "No new candidates — no issue to file."
            exit 0
          fi
          TITLE="vendor-radar: candidates $(date -u +%F)"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/vendor-radar-issue.md \
              || echo "issue update failed — the same report is committed in reports/vendor-radar/"
          else
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/vendor-radar-issue.md \
              --label "story-runner" || echo "issue creation failed — the same report is committed in reports/vendor-radar/"
          fi

      # Bring-up PR for auto-approved passers: roster append (radar-bringup.ts, capped at 3 per
      # run to bound judge spend) + the scoped standard engine run per added product, landing as
      # its own PR with the full disposition table (including the skipped list) in the body.
      # Gated on the ANTHROPIC_API_KEY repo secret because extract/collect-community/judge are
      # LLM stages — without the key nothing is added and passers stay approved-pending in the
      # committed triage report. Branches from the scanned commit, not the report branch, so the
      # bring-up PR carries only roster + engine output.
      - name: Bring-up PR for auto-approved passers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DATE=$(date -u +%F)
          TRIAGE="reports/vendor-radar/$DATE-triage.json"
          if [ ! -f "$TRIAGE" ]; then
            echo "No triage output — no bring-up."
            exit 0
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret not set — auto-approved passers stay approved-pending in $TRIAGE."
            exit 0
          fi
          cp "$TRIAGE" /tmp/triage.json
          BRANCH="vendor-radar-bringup/$RUN_ID"
          git config user.name "ultrametric-vendor-radar"
          git config user.email "noreply@ultrametric.ai"
          git checkout -f -B "$BRANCH" "$GITHUB_SHA"
          pnpm tsx rankings-engine/scripts/radar-bringup.ts --triage /tmp/triage.json --cap 3 > /tmp/bringups.txt
          if [ ! -s /tmp/bringups.txt ]; then
            echo "No products added — no bring-up PR."
            exit 0
          fi
          while read -r ARENA PRODUCT; do
            for STAGE in crawl extract collect-community probe judge; do
              pnpm engine "$STAGE" --category "$ARENA" --product "$PRODUCT"
            done
            pnpm engine derive --category "$ARENA"
            pnpm engine logos --category "$ARENA" --product "$PRODUCT"
          done < /tmp/bringups.txt
          # Same contract as spike-engine: derive restamps rankings.generatedAt and judge adds
          # verdicts, inputs of the vendor-review interchange records, the story graph, and the
          # step rankings.
          pnpm tsx rankings-engine/scripts/generate-vendor-reviews.ts
          pnpm tsx rankings-engine/scripts/generate-story-graph.ts
          pnpm tsx rankings-engine/scripts/generate-step-rankings.ts
          pnpm stats
          pnpm test
          # open-rankings covers the arena data AND reviews/generated (pre-rename: rankings/ +
          # vendors/reviews/generated — both gone; git add on a missing pathspec fails the step).
          git add open-rankings rankings-engine/cache public/badges README.md
          git commit -m "feat(vendor-radar): scoped bring-up of auto-approved candidates ($DATE)"
          git push -u origin "$BRANCH"
          {
            echo "Automated bring-up of auto-approved radar candidates (criteria: \`policies/AGENT_POLICY.md\` \"Vendor-radar candidate approval\", founder authorization 2026-10-13). Products added:"
            sed 's/^/- /' /tmp/bringups.txt
            echo
            echo "Debut scores come from the scoped standard engine run (crawl → extract → collect-community → probe → judge --product → derive → logos); no rank was hand-set. The radar created no new ranking and touched no founder-affiliated product."
            echo
            cat /tmp/vendor-radar-triage.md
          } > /tmp/bringup-pr-body.md
          if ! gh pr create \
            --title "vendor-radar: bring-up $DATE" \
            --body-file /tmp/bringup-pr-body.md \
            --base main --head "$BRANCH"; then
            gh issue create \
              --title "vendor-radar: bring-up ready on $BRANCH" \
              --body "The bring-up is committed on [\`$BRANCH\`](https://github.com/${GITHUB_REPOSITORY}/compare/main...$BRANCH) but PR creation failed — open the PR from the compare link." \
              --label "story-runner" || echo "issue creation also failed — branch $BRANCH is pushed; see run logs"
          fi
