name: Refresh repair and recheck
run-name: 'Repair refresh #${{ inputs.pr }} @${{ inputs.head }} [support-loss-v2]'
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Generated story-runner PR number
        required: true
        type: string
      head:
        description: Expected PR head SHA
        required: true
        type: string
      recover_run:
        description: Explicit failed no-model base-update run whose exact head receipt needs recovery
        required: false
        type: string
      recover_artifact:
        description: Exact failed-run audit artifact ID (required with recover_run)
        required: false
        type: string
      recover_digest:
        description: Audit artifact SHA-256 hex digest (required with recover_run)
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
concurrency:
  group: refresh-repair-${{ inputs.pr }}
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'ultrametricai/ultrametric' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Execute trusted main only. Fetched PR refs are consumed as JSON data.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - run: pnpm install --frozen-lockfile
      - name: Repair, validate, publish, and independently recheck
        id: repair
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          PR_HEAD: ${{ inputs.head }}
          RECOVER_RUN: ${{ inputs.recover_run }}
          RECOVER_ARTIFACT: ${{ inputs.recover_artifact }}
          RECOVER_DIGEST: ${{ inputs.recover_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ inputs.recover_run == '' && secrets.ANTHROPIC_API_KEY || '' }}
          GIT_AUTHOR_NAME: ultrametric-story-runner
          GIT_AUTHOR_EMAIL: noreply@ultrametric.ai
          GIT_COMMITTER_NAME: ultrametric-story-runner
          GIT_COMMITTER_EMAIL: noreply@ultrametric.ai
        run: python3 scripts/refresh-repair.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: refresh-repair-${{ inputs.pr }}-${{ github.run_id }}
          path: ${{ runner.temp }}/refresh-repair-report.json
          if-no-files-found: ignore
      - name: Record repaired head provenance
        if: always() && steps.repair.outputs.published_head != ''
        uses: actions/upload-artifact@v7
        with:
          name: internal-refresh-story-runner-${{ inputs.pr }}-${{ steps.repair.outputs.published_head }}
          path: ${{ runner.temp }}/refresh-repair-report.json
          if-no-files-found: error
          retention-days: 90
