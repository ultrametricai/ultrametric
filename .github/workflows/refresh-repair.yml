name: Refresh repair and recheck
run-name: 'Repair refresh #${{ inputs.pr }} @${{ inputs.head }} [support-loss-v2]'
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Generated story-runner PR number
        required: true
        type: string
      head:
        description: Expected PR head SHA
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  actions: write
  checks: read
concurrency:
  group: refresh-repair-${{ inputs.pr }}
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'ultrametricai/ultrametric' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Execute trusted main only. Fetched PR refs are consumed as JSON data.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - run: pnpm install --frozen-lockfile
      - name: Mint content publication token
        id: content-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CONTENT_BOT_APP_ID }}
          private-key: ${{ secrets.CONTENT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Verify content publication identity
        env:
          APP_SLUG: ${{ steps.content-app.outputs.app-slug }}
          CONTENT_BOT_LOGIN: ${{ vars.CONTENT_BOT_LOGIN }}
        run: |
          if [ -z "$APP_SLUG" ] || [ "$CONTENT_BOT_LOGIN" != "${APP_SLUG}[bot]" ]; then
            echo '::error::CONTENT_BOT_LOGIN must match the configured content App bot login.'
            exit 1
          fi

      - name: Repair, validate, publish, and independently recheck
        id: repair
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          PR_HEAD: ${{ inputs.head }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTENT_TOKEN: ${{ steps.content-app.outputs.token }}
          CONTENT_BOT_LOGIN: ${{ vars.CONTENT_BOT_LOGIN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIT_AUTHOR_NAME: ultrametric-story-runner
          GIT_AUTHOR_EMAIL: noreply@ultrametric.ai
          GIT_COMMITTER_NAME: ultrametric-story-runner
          GIT_COMMITTER_EMAIL: noreply@ultrametric.ai
        run: python3 scripts/refresh-repair.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: refresh-repair-${{ inputs.pr }}-${{ github.run_id }}
          path: ${{ runner.temp }}/refresh-repair-report.json
          if-no-files-found: ignore
      - name: Record repaired head provenance
        if: always() && steps.repair.outputs.published_head != ''
        uses: actions/upload-artifact@v7
        with:
          name: internal-refresh-story-runner-${{ inputs.pr }}-${{ steps.repair.outputs.published_head }}
          path: ${{ runner.temp }}/refresh-repair-report.json
          if-no-files-found: error
          retention-days: 90
