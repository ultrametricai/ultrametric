name: Site rendering bug
description: A page on ultrametric.ai renders wrong (layout, broken page, UI behavior). The site code is maintained in a private repo; this report routes it there.
title: "[site] <short description>"
labels: ["site-rendering"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when a page on [ultrametric.ai](https://ultrametric.ai) looks or behaves
        wrong — layout breakage, a page that errors, controls that don't work. If the DATA
        on the page is wrong (a score, a verdict, metadata, a stale link), use
        "Report an inaccuracy" or "Contest a verdict" instead: the data lives in this repo,
        while the pages are maintained in the private site repo and maintainers route these
        reports there.
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://ultrametric.ai/arena/ai-coding
    validations:
      required: true
  - type: textarea
    id: whats-wrong
    attributes:
      label: What renders wrong
      description: What you see vs what you expected. A screenshot helps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: Safari 18 on iPhone 15, Chrome 130 on macOS, …
    validations:
      required: false
