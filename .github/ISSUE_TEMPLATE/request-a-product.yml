name: Submit a product
description: Ask us to add a product to an Ultrametric ranking (or propose a new ranking)
title: "Submit a product: <product name>"
labels: ["product-request"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check `data/{category}/products.json` (or `data/categories.json` for
        ranking ids) to make sure this product isn't already tracked.
  - type: input
    id: product-name
    attributes:
      label: Product name
      placeholder: Acme Agent
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
      description: >-
        An existing ranking id from data/categories.json (e.g. ai-coding), or "new" if this
        doesn't fit any current ranking — tell us what the new ranking should be called.
      placeholder: ai-coding
    validations:
      required: true
  - type: textarea
    id: urls
    attributes:
      label: URLs
      description: >-
        Site, docs, changelog, GitHub repo — whatever's public. The more we have, the faster
        we can build an evidence pack.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: >-
        One or two sentences: why should this product be in the ranking? What's distinctive
        about how it handles (or doesn't handle) AI agents?
    validations:
      required: true
  - type: dropdown
    id: affiliated
    attributes:
      label: Are you affiliated with this product?
      description: >-
        We still add vendor-submitted products, but affiliation is disclosed and evidence is
        checked the same way regardless of who submits it. If yes, say how (employee,
        maintainer, founder, etc) in the box below.
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: affiliation-detail
    attributes:
      label: Affiliation detail (if yes)
      placeholder: e.g. "I'm a maintainer of this project"
    validations:
      required: false
