name: Submit a stack
description: Propose a cross-market toolchain for the curated /stacks page
title: "[stack] <stack name>"
labels: ["stack-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Stacks are **curated, committed data** — this form feeds review, it never
        auto-publishes. A maintainer checks each pick against the ranking leaderboards
        (scored slots on /stacks resolve live from the rankings) and composes accepted
        stacks into the committed data by PR. Honest disclosures make acceptance
        faster, not slower.
  - type: input
    id: stack-name
    attributes:
      label: Stack name
      description: A short, descriptive name for the stack (who it's for helps — e.g. "Solo agentic founder, zero-ops")
      placeholder: Solo agentic founder, zero-ops
    validations:
      required: true
  - type: textarea
    id: picks
    attributes:
      label: The picks, per ranking
      description: >-
        One line per layer: the ranking id (from data/categories.json) and the product id
        (from data/{arena}/products.json), plus a one-line "why this pick". Layers
        without a judged ranking are fine — mark them "editorial" and they'll be labeled
        AI judgement / editorial on the page, never presented as a scored ranking.
      placeholder: |
        ai-coding: claude-code — the daily driver for the whole build loop
        edge-platforms: cloudflare — one platform for site, workers, and data
        startup-banking: mercury — editorial: no ranking scores treasury yet
    validations:
      required: true
  - type: textarea
    id: shipped
    attributes:
      label: What you shipped with it
      description: >-
        The proof the stack is proven: what you actually built and ran on this
        toolchain (product, scale, timeframe), with links where possible. "I think
        these would go well together" is not a stack.
      placeholder: "Shipped <product> (link) solo from zero to paying users in 4 months on exactly this toolchain; ~N users / $N MRR as of <date>."
    validations:
      required: true
  - type: textarea
    id: affiliations
    attributes:
      label: Affiliations disclosure
      description: >-
        Any relationship to any product in the stack — employee, investor, contractor,
        affiliate/referral deals, free credits, vendor-sponsored content. Write "none"
        if none. Undisclosed affiliations discovered later get the stack pulled.
      placeholder: "none"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Trade-offs, what you'd swap next, who the stack is NOT for.
    validations:
      required: false
