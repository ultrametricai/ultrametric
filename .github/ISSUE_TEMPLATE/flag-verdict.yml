name: Flag a verdict
description: Dispute a specific (product, story) verdict in Ultrametric
title: "[verdict] <category>/<product>: <story id>"
labels: ["verdict-contest", "contest"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: find the exact category, product, and story ids in
        `data/categories.json`, `data/{category}/products.json`, and
        `data/{category}/stories.json`. Find the current verdict in
        `data/{category}/verdicts.json`. See the live site's per-verdict "⚑ contest"
        link to prefill most of this automatically.
  - type: input
    id: category
    attributes:
      label: Category
      description: The ranking id, e.g. ai-coding
      placeholder: ai-coding
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: Product
      description: The product id, e.g. claude-code
      placeholder: claude-code
    validations:
      required: true
  - type: input
    id: story-id
    attributes:
      label: Story id
      description: The story id being contested, e.g. live-app-debugging
      placeholder: live-app-debugging
    validations:
      required: true
  - type: textarea
    id: current-verdict
    attributes:
      label: Current verdict
      description: Tier + quality + confidence, copied verbatim from data/{category}/verdicts.json
      placeholder: "partial, quality 5, confidence medium"
    validations:
      required: true
  - type: textarea
    id: proposed-verdict
    attributes:
      label: Proposed verdict
      description: What you think it should be, and why
      placeholder: "full, quality 8 — because ..."
    validations:
      required: true
  - type: textarea
    id: evidence-urls
    attributes:
      label: Evidence URLs
      description: One or more source URLs supporting your proposed verdict (one per line)
      placeholder: |
        https://example.com/docs/feature
    validations:
      required: true
  - type: textarea
    id: quotes
    attributes:
      label: Quotes
      description: >-
        Verbatim excerpt(s) from each URL above — quote, don't paraphrase, so a maintainer
        can verify the claim directly against the source.
    validations:
      required: true
