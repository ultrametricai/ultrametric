name: Prediction
description: Record a yes/no prediction on an open Ultrametric question
title: "[prediction] <question id>"
labels: ["prediction"]
body:
  - type: markdown
    attributes:
      value: |
        Predictions are yes/no questions auto-generated from live close races (see the
        site's /predictions page — its "Predict" links prefill this form). Each question
        settles mechanically from the public changelog: 'yes' if the challenger's overtake
        event lands before the deadline, 'no' otherwise. Find every open question and its
        exact id in `rankings/predictions.json`.

        v1 records predictions as submitted issues — there is no scoring or leaderboard
        yet. One issue per question per person, filed before the question's deadline,
        counts as your prediction.
  - type: input
    id: question-id
    attributes:
      label: Question id
      description: The question's id, copied verbatim from /predictions or rankings/predictions.json
      placeholder: ai-coding--cline-vs-claude-code--2026-09-04
    validations:
      required: true
  - type: dropdown
    id: prediction
    attributes:
      label: Your prediction
      description: Will the challenger overtake the leader before the question's deadline?
      options:
        - "yes"
        - "no"
    validations:
      required: true
  - type: textarea
    id: reasoning
    attributes:
      label: Reasoning (optional)
      description: Why you think so — evidence links welcome, but not required.
    validations:
      required: false
