name: Vendor response
description: Submit an official, verified vendor statement on a specific (product, story) verdict — published verbatim next to the verdict, CVE-style
title: "Vendor response: <product>/<story>"
labels: ["vendor-response"]
body:
  - type: markdown
    attributes:
      value: |
        This is the official channel for vendors to put a statement on the record next to a
        verdict about their product (see `docs/vendor-responses.md`). Ground rules:

        - **Verbatim.** Your statement is published word-for-word (≤1200 characters), never
          edited or paraphrased by maintainers.
        - **No score-lobbying.** A response never changes a verdict by itself — it enters the
          evidence pool as claimed-docs-tier input for the next re-judge of your product.
        - **Verified.** We publish only after confirming you actually speak for the vendor,
          via one of the verification methods below.
        - **Have reproducible proof instead?** If your point can be demonstrated with keyless,
          deterministic commands, use the *Prove a story* form (`docs/prove-it.md`) — a passing
          recording is far stronger evidence than a statement.

        Find the exact ids in `open-rankings/categories.json`, `open-rankings/{category}/products.json`, and
        `open-rankings/{category}/stories.json`.
  - type: input
    id: product
    attributes:
      label: Product
      description: The product id, e.g. claude-code (your product)
      placeholder: claude-code
    validations:
      required: true
  - type: input
    id: story-id
    attributes:
      label: Story id (or verdict URL)
      description: The story id the verdict you are responding to belongs to, e.g. agentic-agent-docs — or paste the verdict's URL from the live site
      placeholder: agentic-agent-docs
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: Official statement
      description: >-
        The vendor's statement, in your own words, max 1200 characters. This exact text is
        published verbatim next to the verdict. Factual and specific beats promotional —
        acknowledge what's accurate, correct what isn't (with sources), state what's planned.
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Your role
      description: Your role at the vendor, e.g. "DevRel lead", "CTO" — published as the responder's role (not your name)
      placeholder: DevRel lead
    validations:
      required: true
  - type: dropdown
    id: verification-offer
    attributes:
      label: Verification offer
      description: How you will prove you speak for the vendor (see docs/vendor-responses.md for what each involves)
      options:
        - email from company domain
        - PR from org GitHub account
        - DNS TXT record
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: Optional URL to your fuller public statement (blog post, changelog, docs page)
      placeholder: "https://example.com/blog/our-response"
