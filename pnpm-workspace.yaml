packages:
  - .

allowBuilds:
  esbuild: true
  # sharp stays allowed for the scratch playwright+sharp installs the probe recorder uses
  # (pipeline/scripts/record-browser-proof.ts).
  sharp: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.129.0'
  - '@types/node@24.19.1'

# NOTE: the lint toolchain's `typescript` resolution is pinned to 6.0.x by .pnpmfile.cjs
# (typescript-eslint has no TS 7 support yet) — see the comment there before touching either.
pnpmfile: scripts/pnpmfile.cjs
