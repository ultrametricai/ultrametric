<title>Sell the company through an acquisition</title>
<desc>Generated from sell-the-company-through-an-acquisition.json. Prepare the sale objectives and readiness evidence; Appoint advisers and approve the transaction strategy; Review indications and authorize a letter of intent; Manage diligence and the issues register; Approve definitive agreements and closing conditions; Verify conditions and execute the closing; Reconcile post-close obligations and handover. Each arrow preserves a recorded dependency. Execution assessments and explicit signature and approval markers come from the record.</desc>
