<text x="40" y="790" class="muted">Source: get-ein.json and set-up-an-llc.json → metadata.geoNotes, using the countries named in the README.</text>
<text x="40" y="817" class="muted">“Local analog” is the source’s coverage classification; it does not imply equivalent legal or tax treatment.</text>
