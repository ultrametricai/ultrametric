<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1190" viewBox="0 0 1280 1190" role="img" aria-label="Incorporate the company step graph">
<title>Incorporate the company</title>
<desc>Generated from incorporate-c-corp.json. Choose formation service; Check name availability; Submit incorporation filing; Receive the accepted formation documents; Prepare the governing documents and initial resolutions; Sign the governing documents and initial corporate approvals; Prepare the founder equity issuance; Founders sign the equity subscription or purchase agreements; Sign any tax election the jurisdiction requires on the founder stock issuance; File the tax election the jurisdiction requires on the stock issuance, where one exists; File the Statement and Designation by Foreign Corporation with the CA SOS; Appoint a registered agent in each state where you operate; File the New York Application for Authority ($225); File the Texas application for registration (Form 301, $750); File the Florida foreign qualification (form CR2E007, $70); File the Washington foreign registration statement ($180). Each arrow preserves a recorded dependency. Execution assessments and explicit signature and approval markers come from the record.</desc>
