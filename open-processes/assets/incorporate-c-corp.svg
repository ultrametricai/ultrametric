<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1062" viewBox="0 0 760 1062" role="img" aria-label="Incorporate C-Corp step graph">
<rect x="100" y="16" width="560" height="42" rx="8" fill="#0b2233" stroke="#38bdf8" stroke-width="1.5"/>
<text x="380" y="42" text-anchor="middle" fill="#e0f2fe" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14">🧑 Choose formation service (10m)</text>
<line x1="380" y1="58" x2="380" y2="77" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M 375 76 L 380 83 L 385 76 Z" fill="#94a3b8"/>
<rect x="100" y="84" width="560" height="42" rx="8" fill="#0b2e22" stroke="#34d399" stroke-width="1.5"/>
<text x="380" y="110" text-anchor="middle" fill="#d1fae5" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14">🤖 Check name availability (2m)</text>
<line x1="380" y1="126" x2="380" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M 375 144 L 380 151 L 385 144 Z" fill="#94a3b8"/>
<rect x="100" y="152" width="560" height="42" rx="8" fill="#2e230b" stroke="#fbbf24" stroke-width="1.5"/>
<text x="380" y="178" text-anchor="middle" fill="#fef3c7" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14">📝 Submit incorporation filing (30m)</text>
<line x1="380" y1="194" x2="380" y2="213" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M 375 212 L 380 219 L 385 212 Z" fill="#94a3b8"/>
<rect x="100" y="220" width="560" height="42" rx="8" fill="#0b2233" stroke="#38bdf8" stroke-width="1.5"/>
<text x="380" y="246" text-anchor="middle" fill="#e0f2fe" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14">🧑 Receive Certificate of Incorporation (~2d wait)</text>
<line x1="380" y1="262" x2="380" y2="281" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M 375 280 L 380 287 L 385 280 Z" fill="#94a3b8"/>
<rect x="100" y="288" width="560" height="42" rx="8" fill="#2e230b" stroke="#fbbf24" stroke-width="1.5"/>
<text x="380" y="314" text-anchor="middle" fill="#fef3c7" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14">📝 Prepare bylaws &amp; initial resolutions (15m)</text>
<line x1="380" y1="330" x2="380" y2="349" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M 375 348 L 380 355 L 385 348 Z" fill="#94a3b8"/>
<rect x="100" y="356" width="560" height="42" rx="8" fill="#230b33" stroke="#a78bfa" stroke-width="1.5"/>
<text x="380" y="382" text-anchor="middle" fill="#ede9fe" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14">✍ Sign the bylaws and initial board consent (5m)</text>
<line x1="380" y1="398" x2="380" y2="417" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M 375 416 L 380 423 L 385 416 Z" fill="#94a3b8"/>
<rect x="100" y="424" width="560" height="42" rx="8" fill="#2e230b" stroke="#fbbf24" stroke-width="1.5"/>
<text x="380" y="450" text-anchor="middle" fill="#fef3c7" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14">📝 Prepare the founder stock issuance (10m)</text>
<line x1="380" y1="466" x2="380" y2="485" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M 375 484 L 380 491 L 385 484 Z" fill="#94a3b8"/>
<rect x="100" y="492" width="560" height="42" rx="8" fill="#230b33" stroke="#a78bfa" stroke-width="1.5"/>
<text x="380" y="518" text-anchor="middle" fill="#ede9fe" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14">✍ Founders sign the stock purchase agreements (5m)</text>
<line x1="380" y1="534" x2="380" y2="553" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M 375 552 L 380 559 L 385 552 Z" fill="#94a3b8"/>
<rect x="100" y="560" width="560" height="42" rx="8" fill="#230b33" stroke="#a78bfa" stroke-width="1.5"/>
<text x="380" y="586" text-anchor="middle" fill="#ede9fe" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" textLength="544" lengthAdjust="spacingAndGlyphs">✍ Sign any tax election the jurisdiction requires on the founder stock issuance (5m)</text>
<line x1="380" y1="602" x2="380" y2="621" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M 375 620 L 380 627 L 385 620 Z" fill="#94a3b8"/>
<rect x="100" y="628" width="560" height="42" rx="8" fill="#2e230b" stroke="#fbbf24" stroke-width="1.5"/>
<text x="380" y="654" text-anchor="middle" fill="#fef3c7" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" textLength="544" lengthAdjust="spacingAndGlyphs">📝 File the tax election the jurisdiction requires on the stock issuance, where one exists (15m)</text>
<rect x="100" y="730" width="560" height="42" rx="8" fill="#2e230b" stroke="#fbbf24" stroke-width="1.5"/>
<text x="380" y="756" text-anchor="middle" fill="#fef3c7" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" textLength="544" lengthAdjust="spacingAndGlyphs">📝 File the Statement and Designation by Foreign Corporation with the CA SOS (30m) — CA</text>
<rect x="100" y="782" width="560" height="42" rx="8" fill="#0b2233" stroke="#38bdf8" stroke-width="1.5"/>
<text x="380" y="808" text-anchor="middle" fill="#e0f2fe" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" textLength="544" lengthAdjust="spacingAndGlyphs">🧑 Appoint a registered agent in each state where you operate (15m) — multi-state</text>
<rect x="100" y="834" width="560" height="42" rx="8" fill="#2e230b" stroke="#fbbf24" stroke-width="1.5"/>
<text x="380" y="860" text-anchor="middle" fill="#fef3c7" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14">📝 File the New York Application for Authority ($225) (30m) — US-NY</text>
<rect x="100" y="886" width="560" height="42" rx="8" fill="#2e230b" stroke="#fbbf24" stroke-width="1.5"/>
<text x="380" y="912" text-anchor="middle" fill="#fef3c7" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" textLength="544" lengthAdjust="spacingAndGlyphs">📝 File the Texas application for registration (Form 301, $750) (30m) — US-TX</text>
<rect x="100" y="938" width="560" height="42" rx="8" fill="#2e230b" stroke="#fbbf24" stroke-width="1.5"/>
<text x="380" y="964" text-anchor="middle" fill="#fef3c7" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14">📝 File the Florida foreign qualification (form CR2E007, $70) (30m) — US-FL</text>
<rect x="100" y="990" width="560" height="42" rx="8" fill="#2e230b" stroke="#fbbf24" stroke-width="1.5"/>
<text x="380" y="1016" text-anchor="middle" fill="#fef3c7" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14">📝 File the Washington foreign registration statement ($180) (30m) — US-WA</text>
<rect x="76" y="700" width="608" height="346" rx="10" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="6 4"/>
<text x="380" y="720" text-anchor="middle" fill="#64748b" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" textLength="584" lengthAdjust="spacingAndGlyphs">Jurisdiction-conditional steps (attached client-side by lib/jurisdictions.ts, never in static ranks)</text>
</svg>
