<title>Set up mailing address</title>
<desc>Generated from set-up-mailing-address.json. Choose mailing address provider; Sign up and pick an address plan; Fill out the provider's mail-handling authorization; Sign the mail authorization with the witnessing the rules require; Update the address on file (bank, tax authority, vendors). Each arrow preserves a recorded dependency. Execution assessments and explicit signature and approval markers come from the record.</desc>
