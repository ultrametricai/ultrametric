<text x="40" y="642" class="muted">The dashed dependency is conditional. Filing and copies each have a separate, scoped recipient approval.</text>
<line x1="40" y1="668" x2="1240" y2="668" stroke="#27272a"/>
<text x="40" y="696" class="muted">Source: canonical 83(b) workflow and its jurisdiction-scoped projection; connections from README → Open law.</text>
<text x="40" y="722" class="muted">Short labels summarize source steps. The guide retains applicability, stop conditions and the full approval scopes.</text>
<text x="40" y="748" class="muted">The connection cards are a map of related material; they do not define an execution sequence.</text>
