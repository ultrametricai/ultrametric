<title id="title">Set up email marketing: a worked Ultrametric process</title>
<desc id="description">Company context informs workspace creation, then audience setup. The audience feeds templates, welcome automation and signup forms. Each live change requires named human approval. Verify the complete signup journey and save decisions and results in private company context for the next run. The process steps follow the canonical email marketing record; verification and saved context describe this worked example.</desc>
