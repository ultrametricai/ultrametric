<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title description">
<title id="title">Set up email marketing: a worked Ultrametric process</title>
<desc id="description">Company context informs workspace creation, then audience setup. The audience feeds templates, welcome automation and signup forms. Each live change requires named human approval. Verify the complete signup journey and save decisions and results in private company context for the next run. The process steps follow the canonical email marketing record; verification and saved context describe this worked example.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a1a1aa" stroke-opacity=".055"/></pattern>
  <radialGradient id="wash"><stop stop-color="#105a6c" stop-opacity=".28"/><stop offset="1" stop-color="#105a6c" stop-opacity="0"/></radialGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#00d294" stroke-width="1.6"/></marker>
  <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#c4b5fd" stroke-width="1.6"/></marker>
</defs>
<style>
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fafafa}
.eyebrow{font-size:13px;letter-spacing:2px;fill:#00d294;font-weight:650}
.stage{font-size:14px;fill:#a1a1aa;letter-spacing:1px;font-weight:600}
.heading{font-size:20px;font-weight:600}
.body{font-size:17px;fill:#a1a1aa}
.small{font-size:14px;fill:#a1a1aa}
.flow{fill:none;stroke:#00d294;stroke-width:2;marker-end:url(#arrow)}
.feedback{fill:none;stroke:#c4b5fd;stroke-width:2;stroke-dasharray:6 7;marker-end:url(#return);animation:flow 2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
@media(prefers-reduced-motion:reduce){.feedback{animation:none}}
</style>
